# Runs on every pull request and on pushes to main.
# No Azure credentials are used. Everything here works on a public repo
# and checks only the code, never a real subscription.

name: terraform-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: fmt, validate, tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform init (no backend)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate -no-color

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: tflint
        run: |
          tflint --init
          tflint --recursive --format compact
        env:
          GITHUB_TOKEN: ${{ github.token }}

  checkov:
    name: checkov security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fails the build on any new finding. Known lab trade-offs are skipped
      # inline in the .tf files with a reason next to each one.
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          quiet: true
